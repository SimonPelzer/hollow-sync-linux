name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.tag_version.outputs.VERSION }}',
              name: 'Hollow Sync ${{ steps.tag_version.outputs.VERSION }}',
              body: 'Release ${{ steps.tag_version.outputs.VERSION }}',
              draft: true,
              prerelease: false
            });
            return data.id

  build-and-upload:
    name: Build and Upload
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
          # Tauri 1 needs webkit2gtk-4.0, which Ubuntu 24.04 no longer ships.
          # Building on 22.04 also keeps the AppImage compatible with older glibc.
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev librsvg2-dev patchelf file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        if: runner.os != 'Linux'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Dependencies are installed with npm ci (package-lock.json), so build
          # with npm too instead of letting tauri-action pick bun from bun.lock.
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}
          includeDebug: false
          includeRelease: true

      # On Linux the AppImage has to be post-processed before it is uploaded
      # (see scripts/fix-appimage.sh), so build and upload without tauri-action.
      - name: Build Tauri app (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build

      - name: Remove bundled Wayland libraries from AppImage
        if: runner.os == 'Linux'
        run: scripts/fix-appimage.sh src-tauri/target/release/bundle/appimage

      - name: Upload Linux bundles to release
        if: runner.os == 'Linux'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dirs = [
              'src-tauri/target/release/bundle/appimage',
              'src-tauri/target/release/bundle/deb',
            ];
            const files = dirs.flatMap((dir) =>
              fs.readdirSync(dir)
                .filter((f) => f.endsWith('.AppImage') || f.endsWith('.deb'))
                .map((f) => path.join(dir, f)));
            if (files.length === 0) throw new Error('no Linux bundles found');
            for (const file of files) {
              core.info(`uploading ${file}`);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release-id }},
                name: path.basename(file),
                data: fs.readFileSync(file),
              });
            }

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [create-release, build-and-upload]
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: '${{ needs.create-release.outputs.release-id }}',
              draft: false
            });

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [create-release, build-and-upload, publish-release]
    if: always()
    steps:
      - name: Get version from tag
        id: tag_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Notify success
        if: needs.publish-release.result == 'success'
        run: |
          echo "Release ${{ steps.tag_version.outputs.VERSION }} succeeded"
          echo "Hollow Sync is now available for download"

      - name: Notify failure
        if: needs.build-and-upload.result == 'failure' || needs.publish-release.result == 'failure'
        run: |
          echo "Release ${{ steps.tag_version.outputs.VERSION }} failed"
          exit 1